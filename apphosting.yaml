# Firebase App Hosting — backend configuration
# https://firebase.google.com/docs/app-hosting/configure
#
# Secrets ต้องสร้างและ Grant Access ให้ backend ก่อน Deploy เช่น
#   firebase apphosting:secrets:set BRT_SOP_DATABASE_URL
#   firebase apphosting:secrets:set BRT_SOP_ADMIN_EMAIL
# (คำสั่ง set จะถามว่าจะ grant access ให้ backend หรือไม่ — ตอบ Yes)

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 40
  memoryMiB: 1024
  cpu: 1

env:
  - variable: DATABASE_URL
    secret: BRT_SOP_DATABASE_URL
    availability:
      - RUNTIME

  - variable: BOOTSTRAP_ADMIN_EMAIL
    secret: BRT_SOP_ADMIN_EMAIL
    availability:
      - RUNTIME

  # จำนวน connection ต่อ instance (maxInstances × DB_POOL_MAX ต้องไม่เกินขีดจำกัดของฐานข้อมูล)
  - variable: DB_POOL_MAX
    value: "5"
    availability:
      - RUNTIME

  # Firebase Web SDK config of project brt-sop-center (Web App "BRT SOP Center Web").
  # Public values — they are compiled into the browser JavaScript; access is enforced by Firebase Auth + the API.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyD7F7j5WzjdMzK9uxvQcNqIGsHKX7Vjm4Q"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "brt-sop-center.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "brt-sop-center"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:959139949716:web:f8363219ebbf0b47329881"
    availability: [BUILD, RUNTIME]
