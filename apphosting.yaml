# Firebase App Hosting — backend configuration
# https://firebase.google.com/docs/app-hosting/configure
#
# Data lives in Cloud Firestore of the same project; the backend reaches it (and Firebase Auth)
# with its own service account — no database password or Secret Manager entry is needed.

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 40
  memoryMiB: 1024
  cpu: 1

env:
  # First sign-in of this (verified) e-mail creates the first ADMIN of an empty system.
  - variable: BOOTSTRAP_ADMIN_EMAIL
    value: "sl@brt.co.th"
    availability:
      - RUNTIME

  # Firebase Web SDK config of project brt-sop-center (Web App "BRT SOP Center Web").
  # Public values — they are compiled into the browser JavaScript; access is enforced by Firebase Auth + the API.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyD7F7j5WzjdMzK9uxvQcNqIGsHKX7Vjm4Q"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "brt-sop-center.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "brt-sop-center"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:959139949716:web:f8363219ebbf0b47329881"
    availability: [BUILD, RUNTIME]
